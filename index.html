<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Site de Notícias</title>
    <link rel="stylesheet" href="./assets/css/login/estilo.css" />
    <script src="./assets/js/bd.js"></script>
    <script src="./assets/js/login.js"></script>
    <script
      src="https://kit.fontawesome.com/b581796bdd.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <div class="logo">W</div>
      <h1 class="titulo">Meu Site de Notícias</h1>
    </header>
    <div class="container">
      <h1>Login</h1>
      <form>
        <div class="input-grupo">
          <i class="fas fa-envelope"></i>
          <input id="email" type="email" placeholder="Informe seu e-mail" />
        </div>
        <div class="input-grupo">
          <i class="fas fa-lock"></i>
          <input id="senha" type="password" placeholder="Informe sua senha" />
        </div>
        <button
          onclick="
            verificarCredenciais();
            return false;
          "
        >
          <i class="fas fa-sign-in-alt"></i> Entrar
        </button>
      </form>
      <div class="links-auxiliares">
        <a href="#">Esqueceu a senha?</a>
        <span>-</span>
        <a href="#">Registre-se</a>
      </div>
    </div>
  </body>
</html>

<!--
OBS: 
O objetivo do "return false;" no evento onclick é impedir o envio 
padrão (submit) do formulário e o consequente recarregamento da página.

Como funciona:

1. Comportamento Padrão: por estar dentro de uma tag <form>, um elemento 
   <button> sem um atributo type definido se comporta por padrão como 
    type="submit". Isso significa que, ao ser clicado, ele tenta enviar os 
    dados do formulário para o servidor, recarregando a página.
2. Interrupção: quando o JavaScript do atributo onclick executa e termina 
   com return false;, ele avisa ao navegador para cancelar a ação padrão do 
   evento de clique.
3. Resultado: a função verificarCredenciais() é executada normalmente para 
   validar os dados na mesma página via JavaScript, mas a página não é 
   atualizada e o usuário não perde o estado atual da tela.
-->
